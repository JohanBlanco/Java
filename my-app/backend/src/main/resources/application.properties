spring.application.name=gym-platform-api
server.port=8080

# H2 en archivo local (persiste entre reinicios; cambiar a PostgreSQL en producción)
spring.datasource.url=jdbc:h2:file:./data/gymdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
app.jwt.secret=GymPlatformSecretKey2026ChangeThisInProductionMustBeAtLeast256BitsLong!!
app.jwt.expiration-ms=86400000

# Cifrado de secretos (WhatsApp Cloud API, etc.). Cambiar en producción.
# Si se rota esta clave, hay que volver a guardar los secretos en Configuración → WhatsApp.
app.secrets.encryption-key=GymPlatformSecretsAtRest2026ChangeThisInProductionMustBeLong!!
app.secrets.transit-key-path=./data/whatsapp-transit-rsa.pkcs8

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
app.public-base-url=http://localhost:5173

# Subidas de mercadeo (imágenes de promociones)
app.uploads.dir=./data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
